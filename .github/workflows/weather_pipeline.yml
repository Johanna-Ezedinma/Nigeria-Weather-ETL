name: Nigeria Weather ETL Pipeline

on:
  workflow_dispatch:

  schedule:
    # 12:10 AM Nigeria time = 11:10 PM UTC
    - cron: "10 23 * * *"

    # 6:10 AM Nigeria time = 5:10 AM UTC
    - cron: "10 5 * * *"

    # 12:10 PM Nigeria time = 11:10 AM UTC
    - cron: "10 11 * * *"

    # 6:10 PM Nigeria time = 5:10 PM UTC
    - cron: "10 17 * * *"

jobs:
  weather-etl:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run weather ETL pipeline
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: |
          python -m src.pipeline

      - name: Export analytical dataset
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: |
          python -m src.export

      - name: Commit updated dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/weather_observations.csv

          git diff --cached --quiet || git commit -m "Update weather observations"

          git push
